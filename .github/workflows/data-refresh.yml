name: 분기 자료 확인 (AI 정리 · 검토 대기)

# 분기마다 공개 자료(WoRMS · GBIF의 IUCN 적색목록 사본 · OBIS · GBIF)를 다시 받아 사이트 값과 비교하고,
# AI(GitHub Models)가 바뀐 곳을 정리한 '검토 대기' PR을 연다. 사이트 화면(dist/)은 고치지 않는다.
# 사람이 원문을 확인한 뒤에만 기존 수집 스크립트로 별도 갱신 PR을 만든다. 자세한 설명: docs/data-refresh.md
#
# - schedule: 3·6·9·12월 28일 00:00 UTC(09:00 KST). 첫 정기 실행은 2026-12-28.
# - workflow_dispatch: Actions > 이 작업 > Run workflow 로 바로 실행.
# - pull_request: 이 파일이나 스크립트를 고친 PR에서 시험 실행만 한다(검토 대기 PR은 만들지 않고, 결과는 실행 요약과 artifact).
on:
  schedule:
    - cron: '0 0 28 3,6,9,12 *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/refresh_check.py
      - .github/workflows/data-refresh.yml

permissions:
  contents: read

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      models: read
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 공개 자료 다시 받기 · 사이트 값과 비교 · AI 정리
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_check.py --out refresh-out
      - name: 사이트 파일이 그대로인지 확인
        run: git diff --exit-code -- dist/
      - name: 실행 요약에 검토 대기 목록 싣기
        if: always()
        run: test -f refresh-out/review.md && cat refresh-out/review.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: data-refresh-review
          path: refresh-out/
          retention-days: 90

  propose:
    # 정기·수동 실행에서만: 결과를 reports/data-refresh/ 에 담은 '검토 대기' draft PR을 연다(사이트 파일은 건드리지 않음).
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: data-refresh-review
          path: refresh-out
      - name: 검토 대기 PR 열기 (안 되면 이슈로)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          day=$(date -u +%Y-%m-%d)
          branch="data-refresh/${day}-${GITHUB_RUN_ID}"
          dir="reports/data-refresh/${day}"
          mkdir -p "$dir"
          cp refresh-out/review.md refresh-out/review.json "$dir/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add "$dir"
          git commit -m "분기 자료 확인 ${day}: 검토 대기 목록 (사이트 값 변경 없음)"
          git push origin "$branch"
          title="검토 대기: 분기 자료 확인 ${day}"
          head -c 60000 refresh-out/review.md > body.md
          if ! gh pr create --draft --base "${GITHUB_REF_NAME}" --head "$branch" --title "$title" --body-file body.md; then
            echo '::warning::PR을 만들 수 없어 이슈로 남깁니다 (Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests").'
            printf '\n\n결과 파일 브랜치: `%s`\n' "$branch" >> body.md
            gh issue create --title "$title" --body-file body.md
          fi
