name: AI 수정안 (Claude · 초안 PR)

# 주간 점검 이슈를 Claude가 읽고 작은 수정안을 만들어 '초안(draft) PR'로 올린다. 병합은 언제나 사람이 한다.
# 처음에는 꺼져 있다. 켜는 법과 안전장치: docs/ai-maintenance.md
#
# 켜짐 조건 (둘 다 있어야 실행)
#   - 저장소 변수 AI_FIX_ENABLED = true            (Settings > Secrets and variables > Actions > Variables)
#   - 저장소 비밀 ANTHROPIC_API_KEY 또는 CLAUDE_CODE_OAUTH_TOKEN
# 실행 방법
#   - 이슈에 'ai-fix' 라벨을 붙인다 (사람이 고른 이슈만)
#   - Actions > 이 작업 > Run workflow 에 이슈 번호
#   - 주간 점검이 부른다 (저장소 변수 AI_FIX_AUTO = true 일 때만)
#
# 안전장치
#   - Claude가 도는 job은 읽기 권한만 있다(contents: read). Claude는 commit·push·PR을 할 수 없고 파일만 고친다.
#   - Claude가 고친 파일은 scripts/ai_fix_guard.py 를 통과해야 한다(점수 자료·설정·배포 파일 금지, 10파일·300줄 이하).
#   - PR은 다음 job이 draft로 만들고 verify.yml 검사를 돌린다. main에는 아무것도 직접 넣지 않는다.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '고칠 이슈 번호'
        required: true
  workflow_call:
    inputs:
      issue_number:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ai-fix-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    if: vars.AI_FIX_ENABLED == 'true' && (github.event_name != 'issues' || github.event.label.name == 'ai-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: read
    env:
      ISSUE: ${{ inputs.issue_number || github.event.issue.number }}
      PYTHONUTF8: '1'
    outputs:
      ready: ${{ steps.keys.outputs.ready }}
      changed: ${{ steps.collect.outputs.changed }}
      blocked: ${{ steps.collect.outputs.blocked }}
    steps:
      - name: 열쇠 확인
        id: keys
        env:
          A: ${{ secrets.ANTHROPIC_API_KEY }}
          O: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$A$O" ]; then echo ready=true >> "$GITHUB_OUTPUT"; else
            echo '::notice::ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN 비밀 값이 없어 Claude 수정안을 건너뜁니다.'
            echo ready=false >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v6
        if: steps.keys.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        if: steps.keys.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: 이슈 읽기
        if: steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ai-fix
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '"# " + .title + "\n\n" + .body' > .ai-fix/issue.md
          head -c 400 .ai-fix/issue.md
      - name: Claude가 수정안 만들기 (파일만 고침)
        if: steps.keys.outputs.ready == 'true'
        # v1.0.266 (2026-11). 태그가 옮겨져도 같은 코드를 쓰도록 커밋으로 고정.
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            이슈 #${{ env.ISSUE }} 을 처리한다. 할 일과 규칙은 config/ai-fix-prompt.md 에 있다. 먼저 그 파일을 읽고 따른다.
          claude_args: >-
            --model ${{ vars.AI_FIX_MODEL || 'claude-opus-5-5' }}
            --max-turns ${{ vars.AI_FIX_MAX_TURNS || '30' }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node:*),Bash(python:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*)"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(gh:*),Bash(curl:*),Bash(wget:*),WebFetch,WebSearch"
      - name: 고친 파일 모으기 · 안전장치
        id: collect
        if: steps.keys.outputs.ready == 'true'
        run: |
          git diff --numstat -- . ':(exclude).ai-fix' > .ai-fix/numstat.txt || true
          git ls-files --others --exclude-standard -- . ':(exclude).ai-fix' > .ai-fix/new-files.txt || true
          cat .ai-fix/numstat.txt .ai-fix/new-files.txt
          test -f .ai-fix/summary.md || echo '(Claude가 요약을 남기지 않았습니다.)' > .ai-fix/summary.md
          if [ -s .ai-fix/new-files.txt ]; then git add -N $(cat .ai-fix/new-files.txt); git diff --numstat -- . ':(exclude).ai-fix' > .ai-fix/numstat.txt; fi
          if [ -s .ai-fix/numstat.txt ]; then
            echo changed=true >> "$GITHUB_OUTPUT"
            if python scripts/ai_fix_guard.py < .ai-fix/numstat.txt > .ai-fix/guard.txt; then echo blocked=false >> "$GITHUB_OUTPUT"
            else echo blocked=true >> "$GITHUB_OUTPUT"; cat .ai-fix/guard.txt; fi
            git diff --binary -- . ':(exclude).ai-fix' > .ai-fix/change.patch
          else
            echo changed=false >> "$GITHUB_OUTPUT"; echo blocked=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v6
        if: steps.keys.outputs.ready == 'true'
        with:
          name: ai-fix-${{ env.ISSUE }}
          path: |
            .ai-fix/summary.md
            .ai-fix/numstat.txt
            .ai-fix/guard.txt
            .ai-fix/change.patch
          if-no-files-found: ignore
          retention-days: 30

  propose:
    needs: draft
    if: needs.draft.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      ISSUE: ${{ inputs.issue_number || github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ai-fix-${{ env.ISSUE }}
          path: .ai-fix
      - name: 초안 PR 만들기 (막혔거나 고친 것이 없으면 이슈에 설명만)
        env:
          CHANGED: ${{ needs.draft.outputs.changed }}
          BLOCKED: ${{ needs.draft.outputs.blocked }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          { echo "## Claude 수정안 (#$ISSUE)"; echo; cat .ai-fix/summary.md; echo; echo "[실행 기록]($run_url)"; } > body.md
          if [ "$CHANGED" != "true" ]; then
            gh issue comment "$ISSUE" --body-file body.md; exit 0; fi
          if [ "$BLOCKED" = "true" ]; then
            { echo; echo '**안전장치에 걸려 PR을 만들지 않았습니다:**'; sed 's/^/- /' .ai-fix/guard.txt; } >> body.md
            gh issue comment "$ISSUE" --body-file body.md; exit 0; fi
          branch="ai-fix/issue-$ISSUE-$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git apply --index .ai-fix/change.patch
          git commit -m "AI 수정안: 주간 점검 이슈 #$ISSUE (사람 확인 전 초안)"
          git push origin "$branch"
          { echo; echo '---'; echo "이 PR은 Claude가 만든 **초안**입니다. 사람이 내용을 확인하고 검사가 통과한 뒤에만 병합합니다. 병합하면 라이브 사이트에 바로 반영됩니다."; echo; echo "Refs #$ISSUE"; } >> body.md
          if gh pr create --draft --base main --head "$branch" \
               --title "AI 수정안: 주간 점검 #$ISSUE" --body-file body.md > pr.txt; then
            gh workflow run verify.yml --ref "$branch" || true
            gh issue comment "$ISSUE" --body "Claude 수정안 초안 PR: $(cat pr.txt)"
          else
            echo '::warning::PR을 만들 수 없어 이슈에 남깁니다 (Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests").'
            { echo; echo "수정안 브랜치: \`$branch\`"; } >> body.md
            gh issue comment "$ISSUE" --body-file body.md
          fi
