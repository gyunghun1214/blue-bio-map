name: Verify BlueBioMap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-2025
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check browser and data code
        run: |
          node --check dist/app.js
          node --check verification/uicheck.mjs
          node verification/test_followup_decisions.mjs
          node verification/test_verified_ui.mjs
          node verification/test_pilot_ui.mjs
          node verification/test_food_evidence.mjs
          node verification/test_map_boundary.mjs
          node verification/test_csv_export.mjs
          node verification/test_client_outdated.mjs
          node verification/test_mbpi_chembl_ui.mjs
          node verification/test_matrix_map.mjs
          node verification/test_mfpi_substitutes_ui.mjs
          node verification/test_mcui_trend_ui.mjs
          node verification/test_trait_display_ui.mjs
          node --check dist/chatbot.js
          node verification/test_chatbot_faq.mjs
          node verification/test_chatbot_drag.mjs
          node --check worker/index.mjs
          node verification/test_ask_worker.mjs
          node --check dist/expedition.js
          node --check verification/expedition_check.mjs
          node verification/test_expedition_ui.mjs
          node --check dist/intro.js
          node verification/test_intro_ui.mjs
          python scripts/build_expedition_stops.py --check
          python -m unittest discover -s verification -p 'test_*.py'

  browser:
    runs-on: windows-2025
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run full browser checks against this commit
        shell: pwsh
        run: |
          $server = Start-Process -FilePath python -ArgumentList @('-m','http.server','8765','--bind','127.0.0.1','--directory','dist') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Local site did not start on port 8765' }
            node verification/uicheck.mjs verification/ci-ui
            if ($LASTEXITCODE -ne 0) { throw "UI checks failed with exit code $LASTEXITCODE" }
            # Sea expedition page: desktop / phone / reduced motion (WebGL via SwiftShader) and WebGL disabled
            node verification/expedition_check.mjs verification/ci-ui/expedition
            if ($LASTEXITCODE -ne 0) { throw "Expedition checks failed with exit code $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      # Screenshots only when a check fails: uploading every run filled the artifact quota (2026-10-08), and a full
      # quota must not turn passing checks red.
      - name: Upload browser results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ui-check-results
          path: verification/ci-ui/
          if-no-files-found: warn
          retention-days: 3
