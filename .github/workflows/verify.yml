name: Verify BlueBioMap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-2025
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check browser and data code
        # bash -e: any failing command fails the step. The default pwsh judged only the last command's exit code, so five
        # failing checks (a CRLF checkout, a Windows path) passed unnoticed until 2026-10-20.
        shell: bash
        run: |
          node --check dist/app.js
          node --check verification/uicheck.mjs
          node verification/test_followup_decisions.mjs
          node verification/test_verified_ui.mjs
          node verification/test_detail_render.mjs
          node verification/test_escape_sinks.mjs
          node verification/test_pilot_ui.mjs
          node verification/test_food_evidence.mjs
          node verification/test_map_boundary.mjs
          node verification/test_csv_export.mjs
          node verification/test_client_outdated.mjs
          node verification/test_analytics_beacon.mjs
          node verification/test_csp_headers.mjs
          node verification/test_operations.mjs
          node verification/test_release_stamp.mjs
          node verification/test_mbpi_chembl_ui.mjs
          node verification/test_matrix_map.mjs
          node verification/test_mfpi_substitutes_ui.mjs
          node verification/test_mcui_trend_ui.mjs
          node verification/test_mcui_stock_ui.mjs
          node verification/test_type_marks_circle.mjs
          node verification/test_obis_trend_display.mjs
          node verification/test_trait_display_ui.mjs
          node verification/test_supplementary_literature_ui.mjs
          node verification/test_replication_search_ui.mjs
          node verification/test_cmnpd_candidates_ui.mjs
          node verification/test_posthoc_scorecard_ui.mjs
          python scripts/build_posthoc_scorecard.py --csv --check
          python scripts/build_aquaculture_tier.py --check
          node verification/test_compare_ui.mjs
          node verification/test_weight_slider.mjs
          node verification/test_score_format.mjs
          node verification/test_mbpi_kind.mjs
          node verification/test_species_group_icon.mjs
          node verification/test_method_kickers.mjs
          node verification/test_mobile_compact.mjs
          node --check dist/chatbot.js
          node verification/test_chatbot_faq.mjs
          node verification/test_chatbot_drag.mjs
          node --check dist/expedition.js
          node --check verification/expedition_check.mjs
          node --check verification/i18n_layout_check.mjs
          node verification/test_expedition_ui.mjs
          node --check dist/intro.js
          node verification/test_intro_ui.mjs
          node verification/test_shared_link.mjs
          node verification/test_screen_text_ko.mjs
          node --check dist/i18n.js
          node --check dist/i18n-en.js
          node verification/test_i18n.mjs
          python scripts/i18n_data_strings.py --check
          python scripts/build_species_names_en.py --check
          node --check verification/offline_check.mjs
          python scripts/build_expedition_stops.py --check
          python -m unittest discover -s verification -p 'test_*.py'

  browser:
    runs-on: windows-2025
    needs: unit
    # About 17 min on main (2026-10-18: uicheck 7, expedition 8 with WebGL via SwiftShader, offline 1), and a slow runner
    # adds 2–3 min to the expedition alone. The reload checks (G-11, O-8b) wait the 8 s first-visit piece each time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run full browser checks against this commit
        shell: pwsh
        run: |
          $server = Start-Process -FilePath python -ArgumentList @('-m','http.server','8765','--bind','127.0.0.1','--directory','dist') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Local site did not start on port 8765' }
            node verification/uicheck.mjs verification/ci-ui
            if ($LASTEXITCODE -ne 0) { throw "UI checks failed with exit code $LASTEXITCODE" }
            # Sea expedition page: desktop / phone / reduced motion (WebGL via SwiftShader) and WebGL disabled
            node verification/expedition_check.mjs verification/ci-ui/expedition
            if ($LASTEXITCODE -ne 0) { throw "Expedition checks failed with exit code $LASTEXITCODE" }
            # English text layout (README '언어 전환'): overlap, off-screen, wording, species names; 1440, 1280×720 and 390
            $env:FIXTURE = 'dist/live-snapshot.json'
            node verification/i18n_layout_check.mjs verification/ci-ui/i18n-layout
            if ($LASTEXITCODE -ne 0) { throw "English layout checks failed with exit code $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      # Offline demo (docs/offline-demo.md): the launcher's server under Windows PowerShell 5.1, every outside request cut off.
      - name: Run offline demo checks
        shell: pwsh
        run: |
          # The tile cache is never in CI: the plan must still parse and report every tile missing (exit 1).
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/offline/prepare-offline.ps1 -Check
          if ($LASTEXITCODE -ne 1) { throw "prepare-offline.ps1 -Check exited $LASTEXITCODE (expected 1: no tiles in CI)" }
          $server = Start-Process -FilePath powershell -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/offline/serve.ps1','-NoBrowser','-Port','8770') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:8770/' -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Offline demo server did not start on port 8770' }
            node verification/offline_check.mjs verification/ci-ui/offline
            if ($LASTEXITCODE -ne 0) { throw "Offline demo checks failed with exit code $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      # Screenshots only when a check fails: uploading every run filled the artifact quota (2026-10-08), and a full
      # quota must not turn passing checks red.
      - name: Upload browser results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ui-check-results
          path: verification/ci-ui/
          if-no-files-found: warn
          retention-days: 3
